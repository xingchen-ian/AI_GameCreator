name: Deploy course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R course/. _site/
          cp -R student _site/student
          mkdir -p _site/research
          if [ -f student/research/llm_agent_game_design_research_map.html ]; then
            cp student/research/llm_agent_game_design_research_map.html \
              _site/research/llm_agent_game_design_research_map.html
          fi
          python3 .github/scripts/index-student.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
